name: Test Contracts

on:
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/test-contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/test-contracts.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test

  static-analysis:
    runs-on: ubuntu-latest
    continue-on-error: true # advisory; does not block, but findings must be reviewed
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm install
      - name: Install Slither
        run: pip install slither-analyzer
      - name: Run Slither
        run: slither . || true
